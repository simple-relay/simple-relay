<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="400" height="400">
  <!-- Nền khối vuông bo góc (Không tính là chi tiết bên trong) -->
  <rect width="200" height="200" rx="45" fill="#0f172a" />
  
  <!-- Chi tiết 1: Bức tường SQLite (Persist) -->
  <line x1="70" y1="60" x2="70" y2="140" stroke="#cbd5e1" stroke-width="22" stroke-linecap="round" />
  
  <!-- Chi tiết 2: Mũi tên định tuyến (Deliver) -->
  <path d="M 105 60 L 145 100 L 105 140" fill="none" stroke="#34d399" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
</svg>
