<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple HTTP Relay - Apple Themed Logo</title>
    <style>
        body {
            margin: 0;
            padding: 80px 20px;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 80px;
        }
        .container {
            display: flex;
            gap: 60px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .logo-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .label {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: -0.224px;
            color: #7a7a7a; /* Ink Muted 48 */
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Light Theme Version -->
        <div class="logo-wrapper">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="240" height="240">
                <!-- Nền: Parchment ({colors.canvas-parchment} - #f5f5f7) -->
                <rect width="200" height="200" rx="45" fill="#f5f5f7" />
                
                <!-- Bức tường SQLite: Near-Black Ink ({colors.ink} - #1d1d1f) -->
                <line x1="70" y1="60" x2="70" y2="140" stroke="#1d1d1f" stroke-width="22" stroke-linecap="round" />
                
                <!-- Mũi tên Deliver: Action Blue ({colors.primary} - #0066cc) -->
                <path d="M 105 60 L 145 100 L 105 140" fill="none" stroke="#0066cc" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <div class="label">LIGHT TILE (PARCHMENT)</div>
        </div>

        <!-- Dark Theme Version -->
        <div class="logo-wrapper">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="240" height="240">
                <!-- Nền: Near-Black Tile 1 ({colors.surface-tile-1} - #272729) -->
                <rect width="200" height="200" rx="45" fill="#272729" />
                
                <!-- Bức tường SQLite: Pure White ({colors.body-on-dark} - #ffffff) -->
                <line x1="70" y1="60" x2="70" y2="140" stroke="#ffffff" stroke-width="22" stroke-linecap="round" />
                
                <!-- Mũi tên Deliver: Sky Link Blue ({colors.primary-on-dark} - #2997ff) -->
                <path d="M 105 60 L 145 100 L 105 140" fill="none" stroke="#2997ff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <div class="label">DARK TILE (SURFACE TILE 1)</div>
        </div>
    </div>

</body>
</html>
