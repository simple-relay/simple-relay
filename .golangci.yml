run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - misspell
    - unconvert

linters-settings:
  errcheck:
    check-type-assertions: true
    exclude-functions:
      - (*database/sql.DB).Close
      - (*database/sql.Rows).Close
      - (*database/sql.Stmt).Close
      - (io.Closer).Close
      - (io.ReadCloser).Close
      - (*net/http.Response).Body.Close
      - os.Setenv
      - os.Unsetenv

issues:
  exclude-rules:
    # Exclude errcheck and unused warnings in test files
    - path: _test\.go
      linters:
        - errcheck
