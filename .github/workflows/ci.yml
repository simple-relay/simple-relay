name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel in-flight runs on new commits to save GitHub Free organization runner minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  quality-gate:
    name: Quality Gate (Lint, Test, Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Verify Go module tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Check code formatting
        run: |
          test -z "$(gofmt -s -l .)" || (echo "Unformatted files found:" && gofmt -s -l . && exit 1)

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          install-mode: goinstall
          args: --timeout=5m
          verify: false

      - name: Run tests with race detector and coverage
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.out
          fail_ci_if_error: false
          use_oidc: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Verify static compilation (no CGO)
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /dev/null ./cmd/relay

      - name: Verify install.sh script with local mock release
        run: go test -v -race -run TestInstallScript ./cmd/relay

  website-gate:
    name: Website Quality Gate (Astro Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'docs/website/package-lock.json'

      - name: Install dependencies
        working-directory: docs/website
        run: npm ci

      - name: Build site with Astro
        working-directory: docs/website
        run: npm run build
