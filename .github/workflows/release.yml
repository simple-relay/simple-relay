name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release:
    name: Release & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Append Contributors to Release PR
        if: ${{ steps.release.outputs.pr }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_JSON: ${{ steps.release.outputs.pr }}
          REPO: ${{ github.repository }}
        run: |
          python3 -c '
          import json, os, subprocess

          pr_json_str = os.environ.get("PR_JSON", "")
          if not pr_json_str:
              exit(0)
          try:
              pr_data = json.loads(pr_json_str)
          except Exception:
              exit(0)

          pr_number = pr_data.get("number")
          repo = os.environ.get("REPO", "")
          if not pr_number or not repo:
              exit(0)

          # Query latest release tag
          tag_proc = subprocess.run(
              ["gh", "api", f"repos/{repo}/releases/latest", "--jq", ".tag_name"],
              capture_output=True,
              text=True
          )
          latest_tag = tag_proc.stdout.strip() if tag_proc.returncode == 0 else ""

          if latest_tag:
              endpoint = f"repos/{repo}/compare/{latest_tag}...main"
              jq_filter = "[.commits[].author | select(. != null and (.login | endswith(\"[bot]\") | not)) | .login] | unique"
          else:
              endpoint = f"repos/{repo}/commits?per_page=100"
              jq_filter = "[.[].author | select(. != null and (.login | endswith(\"[bot]\") | not)) | .login] | unique"

          contrib_proc = subprocess.run(
              ["gh", "api", endpoint, "--jq", jq_filter],
              capture_output=True,
              text=True
          )

          try:
              contributors = json.loads(contrib_proc.stdout or "[]")
          except Exception:
              contributors = []

          if not contributors:
              exit(0)

          # Fetch current PR body
          body_proc = subprocess.run(
              ["gh", "api", f"repos/{repo}/pulls/{pr_number}", "--jq", ".body"],
              capture_output=True,
              text=True
          )
          body = body_proc.stdout or ""

          # Strip any existing Contributors section to avoid duplication on re-runs
          if "### Contributors" in body:
              body = body[:body.index("### Contributors")].rstrip()

          contrib_lines = ["\n\n### Contributors\n", "Thank you to all contributors who helped make this release possible! ❤️\n"]
          for u in sorted(contributors):
              contrib_lines.append(f"- @{u}\n")

          new_body = body + "".join(contrib_lines)

          # Update PR body via GitHub REST API
          subprocess.run(
              ["gh", "api", "-X", "PATCH", f"repos/{repo}/pulls/{pr_number}", "--input", "-"],
              input=json.dumps({"body": new_body}),
              text=True,
              check=True
          )
          '

      - name: Checkout repository
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Compute Lowercase Repository Owner
        if: ${{ steps.release.outputs.release_created == 'true' }}
        id: repo
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER_LOWER: ${{ steps.repo.outputs.owner }}
